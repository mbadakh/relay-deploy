apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.relay.replicaCount }}
  strategy:
    # Until realtime state is distributed, overlapping old/new Relay processes
    # can split callers across incompatible in-memory state.
    type: {{ ternary "RollingUpdate" "Recreate" .Values.relay.scaleReady }}
  selector:
    matchLabels:
      {{- include "relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relay.selectorLabels" . | nindent 8 }}
        {{- include "relay.labels" . | nindent 8 }}
      annotations:
        checksum/runtime-contract: {{ printf "%s|%s|%s" .Values.customer.appHost .Values.customer.authHost .Values.images.relay.digest | sha256sum }}
        {{- with .Values.relay.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "relay.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-rds-ca
          image: {{ printf "%s@%s" .Values.images.relay.repository .Values.images.relay.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: ["node", "-e"]
          args:
            - |
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              (async () => {
                const response = await fetch(process.env.RDS_CA_URL);
                if (!response.ok) throw new Error(`RDS CA download failed: ${response.status}`);
                const value = Buffer.from(await response.arrayBuffer());
                const digest = crypto.createHash("sha256").update(value).digest("hex");
                if (digest !== process.env.RDS_CA_SHA256) throw new Error("RDS CA digest mismatch");
                fs.writeFileSync("/rds-ca/rds-global-bundle.pem", value, { mode: 0o444 });
              })().catch(error => { console.error(error.message); process.exit(1); });
          env:
            - { name: RDS_CA_URL, value: {{ .Values.database.caBundleUrl | quote }} }
            - { name: RDS_CA_SHA256, value: {{ .Values.database.caBundleSha256 | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - { name: rds-ca, mountPath: /rds-ca }
      containers:
        - name: relay
          image: {{ printf "%s@%s" .Values.images.relay.repository .Values.images.relay.digest | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001, protocol: TCP }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3001" }
            - { name: TRUST_PROXY, value: "1" }
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/relay/rds-global-bundle.pem }
            - { name: CLIENT_ORIGIN, value: {{ .Values.customer.publicOrigin | quote }} }
            - { name: KEYCLOAK_ISSUER, value: {{ printf "%s/auth/realms/%s" .Values.customer.publicOrigin .Values.keycloak.realm | quote }} }
            - { name: KEYCLOAK_CLIENT_ID, value: relay }
            - { name: RELAY_SESSION_ISSUER, value: {{ .Values.customer.publicOrigin | quote }} }
            - { name: RELAY_SESSION_AUDIENCE, value: {{ .Values.relay.sessionAudience | quote }} }
            - { name: RELAY_SESSION_TTL_SECONDS, value: {{ .Values.relay.sessionTtlSeconds | quote }} }
            - { name: S3_BUCKET, value: {{ .Values.storage.mediaBucket | quote }} }
            - { name: S3_REGION, value: {{ default .Values.customer.region .Values.storage.region | quote }} }
            - { name: S3_CREATE_BUCKET, value: "false" }
          envFrom:
            - secretRef: { name: {{ include "relay.fullname" . }}-runtime }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: uploads, mountPath: /app/uploads }
            - { name: rds-ca, mountPath: /etc/relay, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 8Gi }
        - name: uploads
          emptyDir: { sizeLimit: 1Gi }
        - name: rds-ca
          emptyDir: { sizeLimit: 1Mi }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "relay.selectorLabels" . | nindent 14 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
